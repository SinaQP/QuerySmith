[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querysmith"
version = "0.1.0"
description = "Natural language to safe SQL Server SELECT query foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyodbc",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/querysmith"]

[tool.pytest.ini_options]
pythonpath = ["src"]
